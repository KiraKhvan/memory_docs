<svg xmlns="http://www.w3.org/2000/svg" width="680" height="640" viewBox="0 0 680 640" role="img" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>C4, уровень компонентов: gefest</title>
<desc>Запросы фронта и MCP-сервера проходят TenantFilter, затем одну из шести областей (мемориал, люди, разделы, элементы, контент, медиа). Данные идут в Postgres через TenantAwareDataSource, файлы — в S3, ошибки превращает в ответы ApiExceptionHandler.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="640" fill="#FFFFFF"/>
<rect x="14" y="108" width="652" height="412" rx="16" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="8 5"/>
<text x="30" y="126" font-size="14" font-weight="500" fill="#444441" dominant-baseline="central">gefest</text>
<rect x="40" y="226" width="600" height="192" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="244" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Области: контроллер → ProcessService → Service → репозиторий</text>
<g text-anchor="middle" dominant-baseline="central">
<rect x="150" y="20" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="240" y="39" font-size="14" font-weight="500" fill="#3C3489">Фронт</text><text x="240" y="58" font-size="12" fill="#534AB7">Next.js</text>
<rect x="350" y="20" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5" stroke-dasharray="5 3"/><text x="440" y="39" font-size="14" font-weight="500" fill="#3C3489">MCP-сервер</text><text x="440" y="58" font-size="12" fill="#534AB7">планируется</text>
<rect x="40" y="140" width="600" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="340" y="159" font-size="14" font-weight="500" fill="#085041">TenantFilter</text><text x="340" y="178" font-size="12" fill="#0F6E56">мемориал по Host, TenantContext</text>
<rect x="60" y="262" width="170" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="145" y="281" font-size="14" font-weight="500" fill="#3C3489">Мемориал</text><text x="145" y="300" font-size="12" fill="#534AB7">название, оформление</text>
<rect x="255" y="262" width="170" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="340" y="281" font-size="14" font-weight="500" fill="#3C3489">Люди мемориала</text><text x="340" y="300" font-size="12" fill="#534AB7">Subject, даты</text>
<rect x="450" y="262" width="170" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="535" y="281" font-size="14" font-weight="500" fill="#3C3489">Разделы</text><text x="535" y="300" font-size="12" fill="#534AB7">Section, кэш</text>
<rect x="60" y="342" width="170" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="145" y="361" font-size="14" font-weight="500" fill="#3C3489">Элементы</text><text x="145" y="380" font-size="12" fill="#534AB7">Item</text>
<rect x="255" y="342" width="170" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="340" y="361" font-size="14" font-weight="500" fill="#3C3489">Контент</text><text x="340" y="380" font-size="12" fill="#534AB7">Content, 5 типов</text>
<rect x="450" y="342" width="170" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="535" y="361" font-size="14" font-weight="500" fill="#3C3489">Медиа</text><text x="535" y="380" font-size="12" fill="#534AB7">MediaStorage, ссылки</text>
<rect x="40" y="440" width="290" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="185" y="459" font-size="14" font-weight="500" fill="#085041">TenantAwareDataSource</text><text x="185" y="478" font-size="12" fill="#0F6E56">роль и тенант для RLS</text>
<rect x="350" y="440" width="290" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="495" y="459" font-size="14" font-weight="500" fill="#085041">ApiExceptionHandler</text><text x="495" y="478" font-size="12" fill="#0F6E56">ошибки в Problem Details</text>
<rect x="95" y="560" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="185" y="579" font-size="14" font-weight="500" fill="#444441">БД gefest</text><text x="185" y="598" font-size="12" fill="#5F5E5A">Postgres</text>
<rect x="450" y="560" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="540" y="579" font-size="14" font-weight="500" fill="#444441">S3 Timeweb</text><text x="540" y="598" font-size="12" fill="#5F5E5A">фото и видео</text>
</g>
<g stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
<line x1="240" y1="76" x2="240" y2="138"/>
<line x1="440" y1="76" x2="440" y2="138"/>
<line x1="340" y1="196" x2="340" y2="224"/>
<line x1="185" y1="418" x2="185" y2="438"/>
<line x1="495" y1="418" x2="495" y2="438"/>
<line x1="185" y1="496" x2="185" y2="558"/>
<path d="M620 370 L655 370 L655 588 L632 588"/>
</g>
</svg>
