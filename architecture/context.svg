<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>C4, уровень контекста: платформа «У истока»</title>
<desc>Гость, участник и администратор пользуются платформой; участник ещё и через наших ботов в мессенджерах. Платформа использует вход VK ID и Telegram, языковую модель и S3.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="400" fill="#FFFFFF"/>
<g text-anchor="middle" dominant-baseline="central">
<rect x="40" y="20" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="130" y="39" font-size="14" font-weight="500" fill="#444441">Гость</text><text x="130" y="58" font-size="12" fill="#5F5E5A">читает открытое</text>
<rect x="250" y="20" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="340" y="39" font-size="14" font-weight="500" fill="#444441">Участник</text><text x="340" y="58" font-size="12" fill="#5F5E5A">владелец или участник</text>
<rect x="460" y="20" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="550" y="39" font-size="14" font-weight="500" fill="#444441">Администратор</text><text x="550" y="58" font-size="12" fill="#5F5E5A">видит все мемориалы</text>
<rect x="360" y="118" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="430" y="137" font-size="14" font-weight="500" fill="#444441">Telegram, VK</text><text x="430" y="156" font-size="12" fill="#5F5E5A">наши боты</text>
<rect x="40" y="200" width="600" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="340" y="219" font-size="14" font-weight="500" fill="#3C3489">Платформа «У истока»</text><text x="340" y="238" font-size="12" fill="#534AB7">мемориалы, вход, боты</text>
<rect x="40" y="320" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="130" y="339" font-size="14" font-weight="500" fill="#444441">VK ID, Telegram</text><text x="130" y="358" font-size="12" fill="#5F5E5A">вход</text>
<rect x="250" y="320" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="340" y="339" font-size="14" font-weight="500" fill="#444441">Языковая модель</text><text x="340" y="358" font-size="12" fill="#5F5E5A">для ботов</text>
<rect x="460" y="320" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="550" y="339" font-size="14" font-weight="500" fill="#444441">S3 Timeweb</text><text x="550" y="358" font-size="12" fill="#5F5E5A">фото и видео</text>
</g>
<g stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
<line x1="130" y1="76" x2="130" y2="198"/>
<line x1="340" y1="76" x2="340" y2="198"/>
<line x1="550" y1="76" x2="550" y2="198"/>
<path d="M380 76 L380 97 L430 97 L430 116"/>
<line x1="430" y1="174" x2="430" y2="198"/>
<line x1="130" y1="256" x2="130" y2="318"/>
<line x1="340" y1="256" x2="340" y2="318"/>
<line x1="550" y1="256" x2="550" y2="318"/>
</g>
</svg>
