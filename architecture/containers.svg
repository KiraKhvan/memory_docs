<svg xmlns="http://www.w3.org/2000/svg" width="680" height="700" viewBox="0 0 680 700" role="img" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>C4, уровень контейнеров: платформа «У истока»</title>
<desc>Человек пользуется сайтом и нашими ботами в мессенджерах. Внутри платформы: фронт, gefest, MCP-сервер, боты, сервис авторизации и их базы. Снаружи: Telegram и VK, языковая модель, S3, VK ID и вход через Telegram.</desc>
