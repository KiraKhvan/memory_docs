<svg xmlns="http://www.w3.org/2000/svg" width="680" height="600" viewBox="0 0 680 600" role="img" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>PKCE при входе через VK</title>
<desc>Последовательность обмена между браузером, сервисом авторизации и VK ID: секрет V остаётся в сервисе авторизации, через браузер проходят только хеш C и код.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="600" fill="#FFFFFF"/>
<g text-anchor="middle" dominant-baseline="central">
<rect x="25" y="30" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="110" y="48" font-size="14" font-weight="500" fill="#444441">Браузер</text><text x="110" y="68" font-size="12" fill="#5F5E5A">твой компьютер</text>
<rect x="255" y="30" width="170" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="340" y="48" font-size="14" font-weight="500" fill="#3C3489">Сервис авторизации</text><text x="340" y="68" font-size="12" fill="#534AB7">auth.у-истока.рф</text>
<rect x="485" y="30" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="570" y="48" font-size="14" font-weight="500" fill="#085041">VK ID</text><text x="570" y="68" font-size="12" fill="#0F6E56">id.vk.ru</text>
</g>
<g stroke="#888780" stroke-width="0.5" stroke-dasharray="4 4">
<line x1="110" y1="86" x2="110" y2="470"/>
<line x1="340" y1="86" x2="340" y2="100"/><line x1="340" y1="156" x2="340" y2="575"/>
<line x1="570" y1="86" x2="570" y2="265"/><line x1="570" y1="321" x2="570" y2="470"/><line x1="570" y1="526" x2="570" y2="575"/>
</g>
<g text-anchor="middle" dominant-baseline="central">
<rect x="255" y="100" width="170" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="340" y="118" font-size="14" font-weight="500" fill="#3C3489">Загадывает V</text><text x="340" y="138" font-size="12" fill="#534AB7">V остаётся здесь</text>
<rect x="485" y="265" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="570" y="283" font-size="14" font-weight="500" fill="#085041">Ты входишь в VK</text><text x="570" y="303" font-size="12" fill="#0F6E56">VK запоминает C</text>
<rect x="485" y="470" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="570" y="488" font-size="14" font-weight="500" fill="#085041">Хеш от V равен C?</text><text x="570" y="508" font-size="12" fill="#0F6E56">да → выдаёт токен</text>
<rect x="25" y="470" width="170" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/><text x="110" y="488" font-size="14" font-weight="500" fill="#791F1F">Может увидеть вор</text><text x="110" y="508" font-size="12" fill="#A32D2D">C и code, но не V</text>
</g>
<g font-size="12" fill="#5F5E5A" text-anchor="middle">
<text x="226" y="190">Иди в VK, передай C</text>
<text x="455" y="230">C = хеш(V)</text>
<text x="455" y="350">code</text>
<text x="226" y="390">code</text>
<text x="455" y="440">code + V, напрямую</text>
<text x="455" y="555">токен</text>
</g>
<g stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
<line x1="336" y1="200" x2="116" y2="200"/>
<line x1="114" y1="240" x2="564" y2="240"/>
<line x1="566" y1="360" x2="116" y2="360"/>
<line x1="114" y1="400" x2="334" y2="400"/>
<line x1="344" y1="450" x2="564" y2="450"/>
<line x1="566" y1="565" x2="344" y2="565"/>
</g>
</svg>
